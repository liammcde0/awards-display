<!DOCTYPE html>
<html>
<head>
  <title>Awards Player</title>

  <style>
    body{
      margin:0;
      background:black;
      overflow:hidden;
    }

    video{
      width:100vw;
      height:100vh;
      object-fit:contain;
    }
  </style>
</head>

<body style="margin:0;background:black;color:white;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;">

<h1 id="status">READY</h1>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {
  getFirestore,
  doc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDMcwU2zz04FXc_en20wzdSpnL-Z5hmBIw",
  authDomain: "awards-ceremony-73c6b.firebaseapp.com",
  projectId: "awards-ceremony-73c6b",
  storageBucket: "awards-ceremony-73c6b.firebasestorage.app",
  messagingSenderId: "973575550624",
  appId: "1:973575550624:web:c3336371acd87b8464bbc5"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const status = document.getElementById("status");

onSnapshot(
  doc(db, "control", "commands"),
  (snapshot) => {

    const data = snapshot.data();

    if(!data) return;

    status.textContent = data.action.toUpperCase();

  }
);

</script>

</body>
</html>
